<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Pong Duel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🏓 Neon Pong Duel</h1>
      <p>Defend your side, outplay the AI, and reach 7 points first.</p>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="stat">
        <span>You</span>
        <strong id="player-score">0</strong>
      </div>
      <div class="stat">
        <span>CPU</span>
        <strong id="cpu-score">0</strong>
      </div>
      <div class="stat">
        <span>Status</span>
        <strong id="status">Ready</strong>
      </div>
    </section>

    <section class="game-shell">
      <canvas id="game" width="880" height="520" aria-label="Pong game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Press Space to Start</h2>
        <p id="overlay-text">Move with W/S or Arrow keys. First to 7 wins.</p>
        <button id="start-btn">Start Match</button>
      </div>
    </section>

    <footer>
      <p>
        Controls: <kbd>W</kbd><kbd>S</kbd> or <kbd>↑</kbd><kbd>↓</kbd> · <kbd>Space</kbd> pause/start · <kbd>R</kbd> new match
      </p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
