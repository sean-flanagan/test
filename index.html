<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake Arena</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🐍 Neon Snake Arena</h1>
      <p>Eat energy orbs, chain combos, and survive as long as you can.</p>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="stat">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>Best</span>
        <strong id="best">0</strong>
      </div>
      <div class="stat">
        <span>Speed</span>
        <strong id="speed">1x</strong>
      </div>
      <div class="stat">
        <span>Combo</span>
        <strong id="combo">0</strong>
      </div>
    </section>

    <section class="game-shell">
      <canvas id="game" width="520" height="520" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Press Space to Start</h2>
        <p id="overlay-text">Use Arrow keys or WASD to move. Grab cyan orbs and avoid walls and yourself.</p>
        <button id="start-btn">Start Game</button>
      </div>
    </section>

    <footer>
      <p>
        Controls: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> ·
        <kbd>Space</kbd> pause/start · <kbd>R</kbd> restart
      </p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
